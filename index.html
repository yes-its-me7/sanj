const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=v=>{ v=v.toLowerCase().replace(/[^a-z0-9]/g,''); return v.length===12 ? v.match(/.{4}/g).join('-') : v; };
async function unlock(code, silent){
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(B.s),iterations:B.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(B.i)},key,d64(B.c));
    const html=new TextDecoder().decode(pt);
    try{
      localStorage.setItem('sanj_unlock',code);
      const me=JSON.parse(localStorage.getItem('sanj_me')||'{}');
      if(!me.code){ me.code=code; localStorage.setItem('sanj_me',JSON.stringify(me)); }
    }catch(_){}
    document.open(); document.write(html); document.close();
    return true;
  }catch(err){
    try{ localStorage.removeItem('sanj_unlock'); }catch(_){}
    document.documentElement.classList.remove('wait');
    if(!silent) document.getElementById('e').textContent='الرمز غلط';
    return false;
  }
}
const btn=document.getElementById('b'), inp=document.getElementById('c');
btn.onclick=async()=>{ btn.disabled=true; await unlock(norm(inp.value)); btn.disabled=false; };
inp.addEventListener('keydown',e=>{ if(e.key==='Enter') btn.click(); });
let saved=null; try{ saved=localStorage.getItem('sanj_unlock'); }catch(_){}
if(saved){ document.documentElement.classList.add('wait'); unlock(saved,true); }
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
